name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tasksdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tasksdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: tasksdb
      DB_USER: postgres
      DB_PASS: ci-only-password
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install test and lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt pytest
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Check Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build application image
        run: docker compose --env-file .env.example build app
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      - name: Test API with PostgreSQL and Redis
        run: python -m pytest -q
